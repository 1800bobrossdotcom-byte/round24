# CI gate: lint (correctness errors only), unit tests, dependency audit, build.
# Runs on every push + PR to main. Keep it fast — the whole gate is <2 min.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (errors block; warnings are the backlog)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Dependency audit (high+ severity blocks)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
